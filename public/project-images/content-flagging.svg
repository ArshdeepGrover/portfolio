<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7955;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF7955;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" />
  
  <!-- Shield Icon -->
  <g transform="translate(120, 80)">
    <path d="M80 20 L80 20 C100 15, 120 15, 140 20 L140 80 C140 120, 110 140, 80 160 C50 140, 20 120, 20 80 L20 20 C40 15, 60 15, 80 20 Z" 
          fill="#FF7955" opacity="0.8"/>
    <path d="M80 35 L80 35 C95 32, 110 32, 125 35 L125 85 C125 115, 102.5 130, 80 145 C57.5 130, 35 115, 35 85 L35 35 C50 32, 65 32, 80 35 Z" 
          fill="white"/>
    
    <!-- Checkmark -->
    <path d="M65 90 L75 100 L95 70" stroke="#FF7955" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Flag Icon -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="3" height="120" fill="#FF7955"/>
    <path d="M3 0 L3 60 L50 45 L50 15 Z" fill="#FF7955" opacity="0.7"/>
  </g>
  
  <!-- Ruby Gem Icon -->
  <g transform="translate(160, 200)">
    <polygon points="40,10 60,30 40,50 20,30" fill="#FF7955" opacity="0.6"/>
    <polygon points="40,10 50,20 40,30 30,20" fill="#FF7955"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF7955">
    Content Flagging
  </text>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Ruby Gem
  </text>
</svg>