<div class="blog-list-container">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl font-bold mb-8">Blog</h1>

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-12">
      <p class="text-gray-600">Loading posts...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="text-center py-12">
      <p class="text-red-600">{{ error }}</p>
    </div>

    <!-- Blog Posts Grid -->
    <div
      *ngIf="!loading && !error"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
    >
      <article
        *ngFor="let post of posts"
        class="blog-card bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow"
      >
        <!-- External link for Medium posts -->
        <a
          *ngIf="post.externalUrl"
          [href]="post.externalUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div *ngIf="post.banner" class="aspect-video overflow-hidden">
            <img
              [src]="post.banner"
              [alt]="post.title"
              class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
            />
          </div>
          <div class="p-6">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-sm text-gray-500">{{
                formatDate(post.publishedAt)
              }}</span>
              <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded"
                >External</span
              >
            </div>
            <h2
              class="text-xl font-semibold mb-3 hover:text-blue-600 transition-colors"
            >
              {{ post.title }}
            </h2>
            <p class="text-gray-600 mb-4">{{ post.excerpt }}</p>
            <div
              *ngIf="post.tags && post.tags.length"
              class="flex flex-wrap gap-2"
            >
              <span
                *ngFor="let tag of post.tags"
                class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-full"
              >
                {{ tag }}
              </span>
            </div>
          </div>
        </a>

        <!-- Internal link for local posts -->
        <a
          *ngIf="!post.externalUrl"
          [routerLink]="['/blog', post.slug.current]"
        >
          <div *ngIf="post.banner" class="aspect-video overflow-hidden">
            <img
              [src]="post.banner"
              [alt]="post.title"
              class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
            />
          </div>
          <div class="p-6">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-sm text-gray-500">{{
                formatDate(post.publishedAt)
              }}</span>
            </div>
            <h2
              class="text-xl font-semibold mb-3 hover:text-blue-600 transition-colors"
            >
              {{ post.title }}
            </h2>
            <p class="text-gray-600 mb-4">{{ post.excerpt }}</p>
            <div
              *ngIf="post.tags && post.tags.length"
              class="flex flex-wrap gap-2"
            >
              <span
                *ngFor="let tag of post.tags"
                class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-full"
              >
                {{ tag }}
              </span>
            </div>
          </div>
        </a>
      </article>
    </div>

    <!-- Empty State -->
    <div
      *ngIf="!loading && !error && posts.length === 0"
      class="text-center py-12"
    >
      <p class="text-gray-600">No blog posts yet. Check back soon!</p>
    </div>
  </div>
</div>
