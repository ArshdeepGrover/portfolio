<header class="header">
  <nav class="nav">
    <a href="#" class="logo"
      >ArshdeepSingh<span class="logo-extension">.info</span></a
    >

    <div class="desktop-nav">
      <a
        *ngFor="let item of navItems"
        class="nav-link"
        [class.active]="isActive(item)"
        (click)="navigateOrScroll(item)"
      >
        {{ item.label }}
      </a>
      <button (click)="toggleTheme()" class="theme-toggle">
        <svg
          *ngIf="isDarkMode"
          class="theme-icon sun-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        <svg
          *ngIf="!isDarkMode"
          class="theme-icon moon-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>
    </div>

    <div class="mobile-controls">
      <button (click)="toggleTheme()" class="theme-toggle mobile-theme">
        <svg
          *ngIf="isDarkMode"
          class="theme-icon sun-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        <svg
          *ngIf="!isDarkMode"
          class="theme-icon moon-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>
      <button (click)="toggleMobileMenu()" class="mobile-menu-toggle">
        <svg
          *ngIf="!isMobileMenuOpen"
          class="menu-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          *ngIf="isMobileMenuOpen"
          class="menu-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" [class.mobile-menu-open]="isMobileMenuOpen">
    <a
      *ngFor="let item of navItems"
      class="mobile-nav-link"
      [class.active]="isActive(item)"
      (click)="navigateOrScroll(item)"
    >
      {{ item.label }}
    </a>
  </div>
</header>
