<section id="experience" class="about-section">
  <div class="about-container">
    <div class="about-header">
      <h2 class="about-title" data-aos="fade-up">
        Work <span class="title-highlight">Experience</span>
      </h2>
    </div>

    <div class="experience-section" data-aos="fade-up">
      <div class="timeline">
        <div *ngFor="let exp of experiences; let i = index" class="timeline-item" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 100">
          <div class="timeline-marker"></div>
          <h4 class="item-title">{{ exp.title }}</h4>
          <div class="item-meta">
            <span class="company-name">{{ exp.company }}</span>
            <span class="meta-separator">•</span>
            <span class="period">{{ exp.period }}</span>
          </div>
          <p class="item-description">{{ exp.description }}</p>
        </div>
      </div>
    </div>

    <div class="education-section" data-aos="fade-up">
      <h3 class="section-title">Education</h3>
      <div class="timeline">
        <div *ngFor="let edu of education; let i = index" class="timeline-item" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 100">
          <div class="timeline-marker"></div>
          <h4 class="item-title">{{ edu.degree }}</h4>
          <div class="item-meta">
            <span class="company-name">{{ edu.institution }}</span>
            <span class="meta-separator">•</span>
            <span class="period">{{ edu.year }}</span>
          </div>
          <p class="item-description">{{ edu.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
