<section id="projects" class="projects-section">
  <div class="projects-container">
    <div class="projects-header">
      <h2 class="projects-title" data-aos="fade-up">
        My <span class="title-highlight">Projects</span>
      </h2>
      <p class="projects-description" data-aos="fade-up" data-aos-delay="100">
        Here are some of the projects I've worked on. Each project represents a
        unique challenge and solution that showcases my skills and creativity.
      </p>
    </div>

    <div class="projects-grid">
      <div
        *ngFor="let project of projects; let i = index"
        class="project-card"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 100"
      >
        <div class="project-image-container">
          <img
            *ngIf="!project.iframe"
            [src]="project.image"
            [alt]="project.title"
            class="project-image"
          />
          <iframe
            *ngIf="project.iframe"
            [src]="getSafeUrl(project.iframe)"
            [title]="project.title"
            class="project-iframe"
            frameborder="0"
            allowfullscreen
          >
          </iframe>
        </div>

        <div class="project-content">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>

          <div class="technologies-list">
            <span *ngFor="let tech of project.technologies" class="tech-tag">
              {{ tech }}
            </span>
          </div>

          <div class="project-actions">
            <a [href]="project.demoLink" class="demo-button" target="_blank">
              <svg
                class="button-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                ></path>
              </svg>
              Live Demo
            </a>
            <a [href]="project.githubUrl" class="code-button" target="_blank">
              <svg
                class="button-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
                ></path>
              </svg>
              View Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
