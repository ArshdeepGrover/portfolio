<section id="projects" class="projects-section">
  <div class="projects-container">
    <div class="projects-header" data-aos="fade-up">
      <h2 class="section-title">
        My <span class="highlight">Projects</span>
      </h2>
      <p class="section-description">
        A showcase of my recent work and creative solutions
      </p>
    </div>

    <div class="projects-grid">
      <div
        *ngFor="let project of projects; let i = index"
        class="project-card"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 100"
      >
        <div class="project-image-container">
          <img
            [src]="project.image"
            [alt]="project.title"
            class="project-image"
            loading="lazy"
          />
          <div class="project-overlay">
            <div class="project-actions">
              <a [href]="project.demoLink" class="action-btn demo-btn" target="_blank">
                <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
                  <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-1a1 1 0 10-2 0v1H5V7h1a1 1 0 000-2H5z"/>
                </svg>
              </a>
              <a [href]="project.githubUrl" class="action-btn code-btn" target="_blank">
                <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
              </a>
            </div>
          </div>
        </div>

        <div class="project-content">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>
          
          <div class="tech-stack">
            <span *ngFor="let tech of project.technologies.slice(0, 3)" class="tech-tag">
              {{ tech }}
            </span>
            <span *ngIf="project.technologies.length > 3" class="tech-more">
              +{{ project.technologies.length - 3 }}
            </span>
          </div>
          
          <div class="project-buttons">
            <a [href]="project.demoLink" class="btn-demo" target="_blank">
              <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
                <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-1a1 1 0 10-2 0v1H5V7h1a1 1 0 000-2H5z"/>
              </svg>
              Demo
            </a>
            <a [href]="project.githubUrl" class="btn-code" target="_blank">
              <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
              Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
