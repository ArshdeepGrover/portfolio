<header class="blog-header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <!-- Brand -->
    <a routerLink="/" class="brand-link">
      <span class="brand-icon">&gt;_</span>
      <span class="brand-label">blogs<span class="brand-accent">.arshdeepgrover.dev</span></span>
    </a>

    <!-- Nav + Actions -->
    <div class="header-right">
      <nav class="header-nav">
        <a href="https://www.arshdeepgrover.dev" target="_blank" rel="noopener" class="nav-link">Portfolio</a>
        <a href="https://www.linkedin.com/in/arshdeepgrover" target="_blank" rel="noopener" class="nav-link">LinkedIn</a>
      </nav>

      <div class="header-divider"></div>

      <!-- Theme Toggle -->
      <button
        (click)="toggleTheme()"
        class="action-btn"
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <svg *ngIf="isDark" class="icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
        </svg>
        <svg *ngIf="!isDark" class="icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
