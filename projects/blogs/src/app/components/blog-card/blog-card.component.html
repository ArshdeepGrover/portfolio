<div
  class="blog-card"
  [attr.data-aos]="'fade-up'"
  [attr.data-aos-delay]="index * 100"
  [routerLink]="['/blog', blog.id]"
>
  <div class="blog-image-container">
    <img [src]="blog.image" [alt]="blog.title" class="blog-image" />
  </div>
  <div class="blog-content">
    <div class="blog-meta">
      <span class="blog-date">{{ blog.date }}</span>
      <span class="blog-read-time">{{ blog.readTime }} min read</span>
    </div>
    <h3 class="blog-title">{{ blog.title }}</h3>
    <p class="blog-excerpt line-clamp-3">{{ blog.excerpt }}</p>
    <div class="blog-tags">
      <span *ngFor="let tag of blog.tags" class="blog-tag">{{ tag }}</span>
    </div>
    <a [routerLink]="['/blog', blog.id]" class="blog-link">
      Read More
      <svg
        class="link-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
        ></path>
      </svg>
    </a>
  </div>
</div>
