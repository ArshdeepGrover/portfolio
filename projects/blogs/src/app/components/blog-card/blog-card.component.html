<article class="card" [routerLink]="['/', blog.slug]">
  <!-- Image -->
  <div class="card-image">
    <img
      *ngIf="blog.image"
      [src]="blog.image"
      [alt]="blog.title"
      class="image"
    />
    <div *ngIf="!blog.image" class="placeholder">
      <span class="placeholder-text">{{ blog.title.charAt(0) }}</span>
    </div>
    <span class="read-badge" *ngIf="blog.readTime">
      {{ blog.readTime }} min
    </span>
  </div>

  <!-- Content -->
  <div class="card-content">
    <div class="card-top">
      <span class="category-label" *ngIf="blog.category?.name">
        {{ blog.category!.name }}
      </span>
      <time class="date">{{ blog.date | date:'MMM d, yyyy' }}</time>
    </div>

    <h3 class="title">{{ blog.title }}</h3>
    <p class="excerpt">{{ blog.excerpt }}</p>

    <div class="card-footer">
      <span class="read-more">Read →</span>
      <button class="share-btn" (click)="share($event)" aria-label="Share">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
        </svg>
      </button>
    </div>
  </div>
</article>
