<div class="links-page">
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="links-container">
    <div class="profile">
      <a href="https://www.arshdeepsingh.info/" target="_blank" class="avatar-wrapper">
        <img src="/images/arshdeep-singh.png" alt="Arshdeep Singh" class="avatar"/>
      </a>
      <h1 class="profile-name">Arshdeep Singh</h1>
      <p class="profile-handle">&#64;arshdeepgrover</p>
      <p class="profile-title">Full Stack Developer</p>
      <p class="profile-email">arsh199820&#64;gmail.com</p>
      
      <div class="profile-actions">
        <a 
          href="https://arshdeepsingh.info/resume/Arshdeep_Singh_SoftwareDeveloper_Resume.pdf" 
          target="_blank" 
          class="resume-btn"
        >
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Resume
        </a>
      </div>
      
      <div class="profile-highlights">
        <span class="highlight">⚡ Angular Expert</span>
        <span class="highlight">💎 Ruby on Rails</span>
        <span class="highlight">🏆 Hackathon Mentor &amp; Judge</span>
        <span class="highlight">🌟 Open Source Contributor</span>
      </div>
    </div>

    <div class="links-list">
      <a
        *ngFor="let link of visibleLinks; let i = index"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="link-card"
        [style.animation-delay]="i * 0.06 + 's'"
      >
        <div class="link-icon-wrapper" [ngClass]="{'brand-icon': link.iconType === 'image'}">
          <img 
            *ngIf="link.iconType === 'image' && link.imageUrl" 
            [src]="link.imageUrl" 
            [alt]="link.title" 
            class="link-icon-img"
          />
          <span 
            *ngIf="link.iconType !== 'image'" 
            class="link-icon" 
            [innerHTML]="link.safeSvg"
          ></span>
        </div>
        <div class="link-content">
          <span class="link-title">{{ link.title }}</span>
          <span class="link-description">{{ link.description }}</span>
        </div>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>
</div>
