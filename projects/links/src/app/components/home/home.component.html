<div class="links-page">
  <canvas #particleCanvas class="particle-canvas"></canvas>
  
  <div class="floating-icons"></div>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="links-container">
    <button (click)="toggleTheme()" class="theme-toggle" type="button">
      <svg *ngIf="isDarkMode()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="toggle-icon">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <svg *ngIf="!isDarkMode()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="toggle-icon">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>

    <div class="profile">
      <div class="avatar-wrapper">
        <img src="/images/arshdeep-singh.png" alt="Arshdeep Singh" class="avatar"/>
      </div>
      <h1 class="profile-name">Arshdeep Singh</h1>
      <p class="profile-handle">&#64;arshdeepgrover</p>
      <p class="profile-title">Full Stack Developer</p>
      <div class="profile-highlights">
        <span class="highlight">⚡ Angular Expert</span>
        <span class="highlight">💎 Ruby on Rails</span>
        <span class="highlight">🏆 Hackathon Mentor &amp; Judge</span>
        <span class="highlight">🌟 Open Source Contributor</span>
      </div>
    </div>

    <div class="links-list">
      <a
        *ngFor="let link of visibleLinks; let i = index"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="link-card"
        [style.animation-delay]="i * 0.06 + 's'"
      >
        <div class="link-icon-wrapper" [style.background-color]="link.brandColor">
          <span class="link-icon" [innerHTML]="link.safeSvg"></span>
        </div>
        <div class="link-content">
          <span class="link-title">{{ link.title }}</span>
          <span class="link-description">{{ link.description }}</span>
        </div>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <p class="links-footer">&copy; {{ currentYear }} Arshdeep Singh</p>
  </div>
</div>
