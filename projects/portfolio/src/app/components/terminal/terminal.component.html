<div *ngIf="isOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm pointer-events-auto">
  <div class="bg-[#1e1e1e] w-full max-w-3xl h-[60vh] rounded-lg shadow-2xl border border-gray-700 flex flex-col font-mono overflow-hidden transition-all transform scale-100">
    <!-- Mac-like Header -->
    <div class="bg-[#2d2d2d] px-4 py-2 flex items-center gap-2 border-b border-gray-700 flex-shrink-0">
      <div class="w-3 h-3 rounded-full bg-red-500 cursor-pointer hover:bg-red-400" (click)="toggleTerminal()"></div>
      <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
      <div class="w-3 h-3 rounded-full bg-green-500"></div>
      <div class="mx-auto text-gray-400 text-xs font-semibold">guest&#64;arshdeep: ~</div>
    </div>
    
    <!-- Terminal Body -->
    <div id="terminal-window" class="p-4 flex-1 overflow-y-auto text-gray-300 text-sm scroll-smooth" (click)="termInput.focus()">
      <div *ngFor="let line of history" class="mb-1 whitespace-pre-wrap">{{ line }}</div>
      
      <form (submit)="executeCommand()" class="flex mt-2 items-center">
        <span class="text-green-400 mr-2">guest&#64;arshdeep:~$</span>
        <input 
          #termInput
          type="text" 
          name="cmd"
          [(ngModel)]="currentInput" 
          (keydown)="onInputKeyDown($event)"
          class="flex-1 bg-transparent outline-none text-gray-100 placeholder-gray-600 caret-gray-100"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </form>
    </div>
  </div>
</div>
