<section id="skills" class="skills-section">
  <div class="skills-container">
    <div class="skills-header" data-aos="fade-up">
      <h2 class="section-title">
        <span class="highlight">Skills</span>
      </h2>
      <p class="section-description" data-aos="fade-up" data-aos-delay="100">
        The languages, frameworks and practices I work with, and the teaching
        side that sits alongside them.
      </p>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-tabs" data-aos="fade-up" data-aos-delay="100">
      <button
        *ngFor="let tab of categoryTabs"
        type="button"
        class="category-tab"
        [class.active]="activeCategory === tab.name"
        (click)="selectCategory(tab.name)"
      >
        <span class="tab-icon">{{ tab.icon }}</span>
        <span class="tab-name">{{ tab.name }}</span>
        <span class="tab-count">{{ tab.count }}</span>
      </button>
    </div>

    <!-- Filtered Skill Cards Grid -->
    <div class="skills-cards-grid">
      <div
        *ngFor="let skill of filteredSkills; let i = index"
        class="skill-card-tile glass-card glass-card-hover gradient-border-glow float-idle"
        appTilt
        [maxTilt]="8"
        [style.animation-delay.ms]="(i % 8) * 60"
      >
        <div class="skill-tile-header">
          <img
            *ngIf="isLogo(skill.icon)"
            [src]="skill.icon"
            [alt]="skill.name"
            class="skill-tile-logo"
          >
          <span
            *ngIf="!isLogo(skill.icon)"
            class="skill-tile-logo skill-tile-emoji"
            aria-hidden="true"
          >{{ skill.icon }}</span>
          <span class="skill-tile-name" [title]="skill.name">{{ skill.name }}</span>
        </div>
        <div class="skill-proficiency-track">
          <div
            class="skill-proficiency-fill"
            [ngClass]="skill.proficiency"
            [style.width.%]="getProficiencyWidth(skill.proficiency)"
          ></div>
        </div>
      </div>
    </div>

    <!-- Additional Technologies Grid -->
    <div class="additional-tech-section" data-aos="fade-up">
      <div class="section-header">
        <h3 class="section-title">Also worked with</h3>
        <p class="section-description">
          Technologies I've used on projects without claiming them as a
          specialism.
        </p>
      </div>

      <div class="tech-grid">
        <div *ngFor="let tech of otherTechnologies" class="tech-card-container">
          <div class="tech-card-inner">
            <div class="tech-card-front">
              <img [src]="tech.icon" [alt]="tech.name" class="tech-logo">
            </div>
            <div class="tech-card-back">
              <span class="tech-name">{{ tech.name }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
