<section id="playground" class="relative min-h-[400px] md:min-h-[600px] w-full bg-slate-900 overflow-hidden flex flex-col items-center justify-center py-16 px-4" data-aos>
  <div class="z-10 text-center mb-8 relative pointer-events-none">
    <div class="absolute -top-10 -left-10 w-20 h-20 bg-primary/20 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-10 -right-10 w-24 h-24 bg-primary/20 rounded-full blur-3xl"></div>
    <h2 class="text-3xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-orange-400 mb-4 inline-block tracking-tight pointer-events-auto">Interactive Playground</h2>
    <p class="text-gray-400 text-lg max-w-xl mx-auto font-light leading-relaxed pointer-events-auto">
      <span *ngIf="!isGameMode">Draw on the screen with your webcam. <span class="text-primary font-bold">Pinch</span> to draw. <span class="bg-primary/20 text-primary-light px-2 py-0.5 rounded text-xs font-bold uppercase ml-1">Beta</span> Enable gesture scrolling below!</span>
      <span *ngIf="isGameMode" class="text-green-400 font-bold animate-pulse">Mini-Game active! Move your finger to control the paddle!</span>
    </p>
  </div>

  <div class="relative w-full max-w-4xl aspect-[4/3] md:aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-[0_0_40px_rgba(255,121,85,0.15)] transition-all duration-500 hover:shadow-[0_0_50px_rgba(255,121,85,0.25)] ring-1 ring-white/5 mx-auto">
    
    <video #webcam [autoplay]="true" playsinline class="absolute inset-0 w-full h-full object-cover -scale-x-100 opacity-60"></video>
    <canvas #drawCanvas class="absolute inset-0 w-full h-full object-cover -scale-x-100 mix-blend-screen"></canvas>
    
    <!-- Loading Overlay -->
    <div *ngIf="isLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-20 transition-opacity">
      <div class="w-12 h-12 border-4 border-gray-700 border-t-primary rounded-full animate-spin mb-4"></div>
      <div class="text-primary font-bold text-lg tracking-wide uppercase">Initializing Model...</div>
    </div>

    <!-- Start Overlay -->
    <div *ngIf="!isActive && !isLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-20 transition-opacity">
      <button (click)="startCamera()" class="group relative px-8 py-3 bg-primary text-white font-bold rounded-xl overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(255,121,85,0.4)]">
        <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></span>
        <span class="relative flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          Start Camera Experiences
        </span>
      </button>
    </div>
  </div>

  <div class="mt-8 flex flex-wrap justify-center gap-4 z-10 transition-all duration-300 pointer-events-auto" [class.opacity-0]="!isActive" [class.translate-y-4]="!isActive">
    <button (click)="clearCanvas()" *ngIf="!isGameMode" class="flex items-center gap-2 px-6 py-2.5 bg-gray-800 text-gray-300 rounded-xl hover:bg-gray-700 hover:text-white transition-all border border-gray-700 hover:border-gray-500 shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      Clear Canvas
    </button>
    
    <button (click)="toggleGestureNav()" *ngIf="!isGameMode" class="flex items-center gap-2 px-6 py-2.5 rounded-xl transition-all shadow-lg border font-semibold flex-shrink-0" 
            [ngClass]="gestureEnabled ? 'bg-primary text-white border-primary shadow-primary/20' : 'bg-gray-800 text-gray-400 border-gray-700 hover:border-gray-600'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 17-5-5 5-5"/><path d="m3 7 5 5-5 5"/><path d="M16 12H12m0 0H8m4 0V8m0 4v4"/></svg>
      {{ gestureEnabled ? 'Gesture Scroll: ON' : 'Gesture Scroll: OFF' }}
    </button>
    <button (click)="toggleGameMode()" class="flex items-center gap-2 px-6 py-2.5 rounded-xl transition-all shadow-lg text-white font-semibold flex-shrink-0" [ngClass]="isGameMode ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-500 hover:bg-green-600'">
      <svg *ngIf="!isGameMode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg *ngIf="isGameMode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
      {{ isGameMode ? 'Stop Mini-Game' : 'Play Pong Easter Egg' }}
    </button>
    <button (click)="stopCamera()" class="flex items-center gap-2 px-6 py-2.5 bg-red-500/10 text-red-500 hover:bg-red-500/20 hover:text-red-400 border border-red-500/20 rounded-xl transition-all shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
      Stop Camera
    </button>
  </div>
</section>
