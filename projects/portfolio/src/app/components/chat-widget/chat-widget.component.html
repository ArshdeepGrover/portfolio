<div class="fixed bottom-6 right-6 z-[999] flex flex-col items-end pointer-events-none">
  
  <!-- Chat Window -->
  <div [class.hidden]="!isOpen" class="pointer-events-auto backdrop-blur-xl bg-white/90 dark:bg-gray-900/90 rounded-2xl shadow-[0_20px_50px_rgba(255,121,85,0.2)] w-80 sm:w-96 mb-4 flex flex-col overflow-hidden transition-all transform origin-bottom-right border border-white/30 dark:border-gray-700 mx-4 sm:mx-0">
    <!-- Header -->
    <div class="bg-gradient-to-r from-primary to-orange-400 text-white p-4 flex justify-between items-center relative overflow-hidden">
      <div class="absolute inset-0 bg-white/10 mix-blend-overlay" style="background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0); background-size: 16px 16px;"></div>
      
      <div class="flex items-center gap-3 relative z-10">
        <div class="relative w-10 h-10 rounded-full bg-white flex items-center justify-center p-1 shadow-md">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=portfolio" class="w-full h-full rounded-full" alt="AI Avatar" />
          <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border border-white rounded-full animate-pulse"></div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 class="font-bold text-sm tracking-wide">Arshdeep's AI</h3>
            <span class="text-[9px] bg-white/20 px-1.5 py-0.5 rounded text-white font-bold tracking-tighter">BETA</span>
          </div>
          <p class="text-[10px] text-white/90 uppercase tracking-widest font-semibold flex items-center gap-1">Online</p>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-white hover:text-gray-200 focus:outline-none rounded-full p-1 hover:bg-white/10 transition-colors z-10 relative">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Messages Area -->
    <div class="relative flex-1">
      <div #scrollMe class="p-4 h-80 overflow-y-auto bg-gray-50/50 dark:bg-gray-800/10 flex flex-col gap-4 scroll-smooth">
        <div *ngFor="let msg of messages" 
             [ngClass]="msg.isBot ? 'self-start' : 'self-end'" 
             class="max-w-[85%] rounded-2xl px-4 py-2 text-sm break-words shadow-sm chat-bubble"
             [class.bg-white]="msg.isBot"
             [class.dark:bg-gray-700]="msg.isBot"
             [class.text-gray-800]="msg.isBot"
             [class.dark:text-gray-200]="msg.isBot"
             [class.bg-primary]="!msg.isBot"
             [class.text-white]="!msg.isBot"
             [class.rounded-tr-none]="!msg.isBot"
             [innerHTML]="msg.text">
        </div>
        
        <!-- Typing indicator -->
        <div *ngIf="isTyping" class="self-start bg-white dark:bg-gray-700 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm w-16">
          <div class="flex gap-1 items-center justify-center h-full">
            <div class="w-2 h-2 bg-gray-400 dark:bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            <div class="w-2 h-2 bg-gray-400 dark:bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
            <div class="w-2 h-2 bg-gray-400 dark:bg-gray-400 rounded-full animate-bounce"></div>
          </div>
        </div>

        <!-- Quick Action Chips -->
        <div *ngIf="messages.length && messages[messages.length-1].isBot && !isTyping && messages.length < 5" class="self-start flex flex-wrap gap-2 mt-[-4px]">
          <button *ngFor="let suggestion of suggestions" (click)="sendSuggestion(suggestion)" class="px-3 py-1.5 text-xs font-medium text-primary bg-primary/10 hover:bg-primary hover:text-white border border-primary/20 rounded-full transition-all duration-300">
            {{ suggestion }}
          </button>
        </div>
      </div>
    </div>
    
    <!-- Input Area -->
    <div class="p-3 bg-white/70 dark:bg-gray-900/70 border-t border-gray-200 dark:border-gray-700 backdrop-blur-3xl">
      <form (submit)="sendMessage()" class="flex gap-2">
        <input 
          type="text" 
          name="message"
          [(ngModel)]="newMessage" 
          placeholder="Ask me anything..." 
          class="flex-1 bg-white dark:bg-gray-800 dark:text-white px-4 py-2.5 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-primary shadow-inner border border-gray-100 dark:border-gray-700 transition-all font-medium"
        />
        <button 
          type="submit" 
          [disabled]="!newMessage.trim() || isTyping"
          class="bg-gradient-to-r from-primary to-orange-400 hover:scale-105 active:scale-95 text-white rounded-full w-[42px] h-[42px] flex items-center justify-center transition-all disabled:opacity-50 disabled:scale-100 disabled:cursor-not-allowed shadow-md relative overflow-hidden group">
          <span class="absolute inset-0 bg-white/20 -translate-x-full group-hover:animate-[shimmer_1s_infinite]"></span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-1 relative z-10 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform duration-300">
            <path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Floating Chat Button - Simple & Clean Design to Guarantee Visibility -->
  <button [class.hidden]="isOpen" (click)="toggleChat()" class="pointer-events-auto flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-primary to-orange-500 text-white rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 mr-2 sm:mr-0 z-50">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    <span class="absolute -top-1 -right-1 flex h-4 w-4">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-4 w-4 bg-orange-500 border-2 border-white"></span>
    </span>
  </button>
</div>
