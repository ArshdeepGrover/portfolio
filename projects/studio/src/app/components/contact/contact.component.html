<section id="contact" class="section">
  <div class="max-w-7xl mx-auto">
    <div class="contact-grid">
      <div class="contact-info" data-aos="slide-right">
        <p class="section-tag">Get In Touch</p>
        <h2 class="contact-title">Let's Build Something Amazing Together</h2>
        <p class="contact-desc">
          Have a project in mind? We'd love to hear about it. Fill out the form
          or reach out through any of our channels below.
        </p>

        <div class="contact-details">
          <div class="detail-item">
            <span class="detail-icon">📧</span>
            <div>
              <p class="detail-label">Email</p>
              <a href="mailto:arshdeepgroverdev@gmail.com" class="detail-value">arshdeepgroverdev&#64;gmail.com</a>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">📅</span>
            <div>
              <p class="detail-label">Book a Meeting</p>
              <a href="https://calendly.com/arshdeepgrover" target="_blank" class="detail-value">calendly.com/arshdeepgrover</a>
            </div>
          </div>
        </div>

        <div class="social-links">
          <a href="https://linkedin.com/in/ArshdeepGrover" target="_blank" class="social-link" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
          <a href="https://github.com/ArshdeepGrover" target="_blank" class="social-link" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
          <a href="https://x.com/ArshdeepGroverS" target="_blank" class="social-link" aria-label="X/Twitter">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
      </div>

      <div class="contact-form-wrapper" data-aos="slide-left">
        <form class="contact-form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" [(ngModel)]="formData.name" name="name" class="form-input" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" [(ngModel)]="formData.email" name="email" class="form-input" placeholder="you@company.com" required>
          </div>
          <div class="form-group">
            <label for="company" class="form-label">Company</label>
            <input type="text" id="company" [(ngModel)]="formData.company" name="company" class="form-input" placeholder="Your company name">
          </div>

          <div class="form-group">
            <label for="message" class="form-label">Project Details</label>
            <textarea id="message" [(ngModel)]="formData.message" name="message" class="form-input form-textarea" placeholder="Tell us about your project..." rows="5" required></textarea>
          </div>
          <button type="submit" class="submit-btn" [class.submitted]="submitted" [class.error]="error" [disabled]="submitting">
            {{ submitting ? 'Sending...' : submitted ? 'Message Sent! ✓' : error ? 'Failed to send. Try again.' : 'Send Message' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
